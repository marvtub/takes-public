<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Clean Studio title card: the hook on a white rounded panel above the head. Fraunces 600 with
         one italic accent word and a gold sparkle. The panel rises in, then the words arrive one by
         one. Starts from HyperFrames' titlecard-calm (Apache-2.0), changed for this style.
         Put your clip next to this file as footage.mp4. Edit TEXT and AT below. Wrap the accent word
         in <i>…</i>. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("../../fonts/Fraunces-Variable.ttf"); font-weight: 100 900; }
      @font-face { font-family: "Fraunces"; src: url("../../fonts/Fraunces-Italic-Variable.ttf"); font-style: italic; font-weight: 100 900; }
      :root { --ink: #1c1c22; --accent: #e2586f; --spark: #f2b526; --panel: rgba(255, 255, 255, 0.92);
              --serif: "Fraunces", serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f7f4ef; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #panel { position: absolute; left: 70px; right: 70px; top: 190px; padding: 22px 30px; border-radius: 28px;
               background: var(--panel); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); text-align: center;
               font-family: var(--serif); font-weight: 600; font-size: 76px; line-height: 1.1; color: var(--ink);
               font-optical-sizing: auto; }
      #panel i { color: var(--accent); font-weight: 500; }
      .sp { color: var(--spark); font-size: 48px; vertical-align: middle; display: inline-block; margin-right: 6px; }
      .wd { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <video id="footage" src="footage.mp4" data-start="0" data-duration="4" data-track-index="0" muted playsinline></video>
      <div id="panel"><span class="sp">✦</span></div>
    </div>
    <script>
      // The headline (one line, or two at most) and when each part lands (seconds). Put the times on
      // the spoken words when the card sits over a voice.
      const TEXT = "One rule for a <i>calm</i> week";
      const AT = { panel: 0.2, first: 0.4, stagger: 0.08, out: 3.5 };

      const panel = document.getElementById("panel");
      const tmp = document.createElement("div"); tmp.innerHTML = TEXT;
      const words = [];
      tmp.childNodes.forEach(n => {
        const parts = n.nodeType === 3 ? n.textContent.split(" ") : [n.outerHTML];
        parts.forEach(w => {
          if (!w) return;
          const s = document.createElement("span"); s.className = "wd"; s.innerHTML = w;
          panel.appendChild(document.createTextNode(" ")); panel.appendChild(s); words.push(s);
        });
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#panel", { opacity: 0, y: 24, scale: 0.97 });
      gsap.set(".sp", { opacity: 0, scale: 0.4, rotate: -40 });
      gsap.set(words, { opacity: 0, y: 18 });
      tl.to("#panel", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, AT.panel);
      words.forEach((s, i) => tl.to(s, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, AT.first + i * AT.stagger));
      tl.to(".sp", { opacity: 1, scale: 1, rotate: 0, duration: 0.5, ease: "back.out(2)" }, AT.first + words.length * AT.stagger);
      tl.to("#panel", { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" }, AT.out);
      tl.set({}, {}, 4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
