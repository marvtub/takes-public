<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Clean Studio lower third: a white rounded panel with a gold sparkle, the name in Fraunces and
         one line in Inter. It sits on the chest, above the caption pill, never over the face.
         Starts from HyperFrames' lt-side-rule (Apache-2.0): its side bar is the sparkle here, and the
         panel and type are this style's. Put your clip next to this file as footage.mp4, and edit
         TEXT and AT. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("../../fonts/Fraunces-Variable.ttf"); font-weight: 100 900; }
      @font-face { font-family: "Inter"; src: url("../../fonts/Inter-Medium.ttf"); font-weight: 500; }
      :root { --ink: #1c1c22; --muted: #66666f; --spark: #f2b526; --panel: rgba(255, 255, 255, 0.94);
              --serif: "Fraunces", serif; --sans: "Inter", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f7f4ef; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #lt { position: absolute; left: 70px; top: 1220px; max-width: 940px; padding: 26px 40px 28px 34px;
            border-radius: 28px; background: var(--panel); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
            display: flex; align-items: center; gap: 22px; }
      #sp { color: var(--spark); font-size: 54px; line-height: 1; }
      #name { font-family: var(--serif); font-weight: 600; font-size: 64px; line-height: 1.05; color: var(--ink); white-space: nowrap; }
      #line { font-family: var(--sans); font-weight: 500; font-size: 32px; line-height: 1.3; color: var(--muted); margin-top: 6px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <video id="footage" src="footage.mp4" data-start="0" data-duration="5" data-track-index="0" muted playsinline></video>
      <div id="lt"><span id="sp">✦</span><div><div id="name"></div><div id="line"></div></div></div>
    </div>
    <script>
      const TEXT = { name: "Your Name", line: "What you do, in five words" };
      const AT = { in: 0.3, out: 4.4 };

      document.getElementById("name").textContent = TEXT.name;
      document.getElementById("line").textContent = TEXT.line;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#lt", { opacity: 0, y: 28, scale: 0.97, transformOrigin: "0% 50%" });
      gsap.set(["#name", "#line"], { opacity: 0, y: 14 });
      gsap.set("#sp", { opacity: 0, scale: 0.4, rotate: -40 });
      // In: the panel rises, the name, then the line, then the sparkle pops. Out: half as long, all together.
      tl.to("#lt", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, AT.in);
      tl.to("#name", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, AT.in + 0.12);
      tl.to("#line", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, AT.in + 0.24);
      tl.to("#sp", { opacity: 1, scale: 1, rotate: 0, duration: 0.5, ease: "back.out(2)" }, AT.in + 0.3);
      tl.to("#lt", { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" }, AT.out);
      tl.set({}, {}, 5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
