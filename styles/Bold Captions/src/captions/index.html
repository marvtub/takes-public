<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Bold captions: Montserrat 900, all caps, white with a 16 px black stroke and a hard drop
         shadow, centred under the face. At most two short lines (14 characters each) at a time.
         Each word pops in (scale 0.6 to 1, overshoot) on its spoken time. Key words go yellow
         or green. Put your clip next to this file as footage.mp4 and the words with their start
         times (from the transcript) in WORDS. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("../../fonts/Montserrat-Variable.ttf"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e2350; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.08) saturate(1.1); }
      .cp { position: absolute; left: 70px; right: 70px; top: 1150px; text-align: center; font-family: "Montserrat", sans-serif;
            font-weight: 900; font-size: 98px; line-height: 1.04; letter-spacing: -1px; text-transform: uppercase; color: #fff;
            -webkit-text-stroke: 16px #000; paint-order: stroke fill; text-shadow: 0 10px 0 #000, 0 14px 30px rgba(0, 0, 0, 0.6); }
      .cp .ln { white-space: nowrap; }
      .cp .w { display: inline-block; margin: 0 0.17em; }
      .y { color: #ffe600; } .g { color: #3cff6b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-width="1080" data-height="1920">
      <video id="footage" src="footage.mp4" data-start="0" data-duration="6.5" data-track-index="0" muted playsinline></video>
    </div>
    <script>
      // [word, start second, colour]. Colour: "y" (yellow) or "g" (green) for the one or two
      // words that matter. A phrase ends after a word that ends in . , ? ! or when it would pass
      // two lines of LINE characters.
      const WORDS = [["This", 0.3], ["one", 0.6, "y"], ["habit", 0.9], ["saves", 1.4], ["5", 1.75, "g"], ["hours", 1.95, "g"],
                     ["a", 2.6], ["week.", 2.75], ["Most", 3.4], ["of", 3.65], ["it", 3.75], ["goes", 3.9], ["to", 4.3], ["meetings.", 4.5, "y"]];
      const LINE = 14, END = 6.5;

      // Group words into phrases of up to two lines.
      const phrases = [];
      let cur = [[]];
      const flush = () => { if (cur[0].length) phrases.push(cur); cur = [[]]; };
      WORDS.forEach(w => {
        const ln = cur[cur.length - 1];
        const len = ln.map(x => x[0]).join(" ").length;
        if (ln.length && len + 1 + w[0].length > LINE) { if (cur.length === 2) flush(); else cur.push([]); }
        cur[cur.length - 1].push(w);
        if (/[.,?!]$/.test(w[0])) flush();
      });
      flush();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = document.getElementById("root");
      phrases.forEach((lines, k) => {
        const el = document.createElement("div"); el.className = "cp"; root.appendChild(el);
        const all = lines.flat();
        const spans = [];
        lines.forEach(line => {
          const l = document.createElement("div"); l.className = "ln"; el.appendChild(l);
          line.forEach(([w, , c]) => { const s = document.createElement("span"); s.className = "w" + (c ? " " + c : ""); s.textContent = w; l.appendChild(s); spans.push(s); });
        });
        const to = k + 1 < phrases.length ? phrases[k + 1][0][0][1] : END;
        gsap.set(spans, { opacity: 0, scale: 0.6 });
        // Each word pops on its spoken time. The phrase cuts out when the next one starts.
        spans.forEach((s, i) => tl.to(s, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(3)" }, all[i][1]));
        tl.set(spans, { opacity: 0 }, to - 0.02);
      });
      tl.set({}, {}, 6.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
