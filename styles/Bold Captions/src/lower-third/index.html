<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Bold lower third: your name in a white label box (Montserrat 900, black, all caps) and one
         line under it in a yellow tag. It sits low on the frame, under the hands, clear of the
         face. Each box pops in (scale, overshoot), 0.12 s apart, and pops out together.
         Starts from HyperFrames' lt-side-rule (Apache-2.0): its bar is a yellow tag here, and the
         type is this style's. Put your clip next to this file as footage.mp4, and edit TEXT and AT. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("../../fonts/Montserrat-Variable.ttf"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e2350; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.08) saturate(1.1); }
      #lt { position: absolute; left: 90px; top: 1430px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
            font-family: "Montserrat", sans-serif; text-transform: uppercase; color: #000; }
      #name { background: #fff; border-radius: 22px; padding: 16px 30px; font-weight: 900; font-size: 68px; line-height: 1.05;
              letter-spacing: -0.5px; white-space: nowrap; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35); transform-origin: 0 50%; }
      #line { background: #ffe600; border-radius: 16px; padding: 10px 22px; font-weight: 800; font-size: 34px; line-height: 1.1;
              white-space: nowrap; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <video id="footage" src="footage.mp4" data-start="0" data-duration="5" data-track-index="0" muted playsinline></video>
      <div id="lt"><div id="name"></div><div id="line"></div></div>
    </div>
    <script>
      const TEXT = { name: "Your Name", line: "What you do, in five words" };
      const AT = { in: 0.3, out: 4.4 };

      document.getElementById("name").textContent = TEXT.name;
      document.getElementById("line").textContent = TEXT.line;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#name", "#line"], { opacity: 0, scale: 0.6 });
      tl.to("#name", { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, AT.in);
      tl.to("#line", { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, AT.in + 0.12);
      tl.to(["#name", "#line"], { opacity: 0, scale: 0.85, duration: 0.12, ease: "power2.in" }, AT.out);
      tl.set({}, {}, 5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
