<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Bold title card: a white label box at the top of the frame, over the footage, with the
         title in Montserrat 900 black, all caps, two lines at most. It pops in (scale 0.7 to 1,
         overshoot), holds, and pops out in half the time. The face stays clear.
         Starts from HyperFrames' titlecard-calm (Apache-2.0), changed for this style.
         Put your clip next to this file as footage.mp4, and edit TEXT and AT. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("../../fonts/Montserrat-Variable.ttf"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e2350; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.08) saturate(1.1); }
      #label { position: absolute; left: 170px; right: 170px; top: 110px; background: #fff; border-radius: 22px; padding: 22px 30px;
               text-align: center; font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 64px; line-height: 1.08;
               letter-spacing: -0.5px; text-transform: uppercase; color: #000; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <video id="footage" src="footage.mp4" data-start="0" data-duration="4" data-track-index="0" muted playsinline></video>
      <div id="label"></div>
    </div>
    <script>
      // The title (one line break with \n), and when it pops in and out (seconds).
      const TEXT = "Where your\n5 hours go";
      const AT = { in: 0.3, out: 3.6 };

      document.getElementById("label").innerText = TEXT;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#label", { opacity: 0, scale: 0.7 });
      tl.to("#label", { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, AT.in);
      tl.to("#label", { opacity: 0, scale: 0.85, duration: 0.12, ease: "power2.in" }, AT.out);
      tl.set({}, {}, 4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
