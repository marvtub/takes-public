# Takes does not take outside contributions. This closes each new pull request with a note.
name: Close pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for the interest. Takes is shared as is and does not take pull requests. Fork it and make it yours."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
