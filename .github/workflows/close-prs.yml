# Takes does not take outside contributions. This closes each new pull request with a note.
name: Close pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for the interest. Takes does not take pull requests, so one person keeps it consistent. Ideas are welcome in Discussions, or fork it and make it yours."
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
