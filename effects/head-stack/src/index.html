<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Head stack: small cream name tags drop from above, one after another, with a speed blur, and stack up on
         the speaker's head like a pile of labels, each a little crooked. A few land on the shoulder instead. The
         pile rides on the head as it moves. Then a gust sweeps them all off, up and away.
         Inputs next to this file: footage.mp4 (the moment, at the frame size) and track.js (from
         `python3 track.py <this folder>`, which reads person.webm: the top of the head per frame).
         Full frame: render it as mp4 and lay it over the cut. The frame size is data-width / data-height on #root.
         Edit TAGS, LOOK and AT below. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="track.js"></script>
    <style>
      @font-face { font-family: "Plex Mono"; src: url("fonts/IBMPlexMono-Medium.ttf"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #cam, #root video { position: absolute; inset: 0; width: 100%; height: 100%; }
      #root video { object-fit: cover; }
      .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: "Plex Mono", monospace; color: #1d2a22;
             background: var(--cream); border-radius: calc(var(--u) * 9px); padding: calc(var(--u) * 6px) calc(var(--u) * 16px);
             box-shadow: 0 calc(var(--u) * 5px) calc(var(--u) * 12px) rgba(0,0,0,.45), inset 0 -2px 0 rgba(0,0,0,.08);
             font-size: calc(var(--u) * 44px); font-weight: 500; letter-spacing: -0.01em; opacity: 0; }
      .tag small { font-size: 0.56em; margin-left: 0.35em; color: #4c5a51; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="1080" data-height="1920">
      <div id="cam"><video id="footage" class="clip" src="footage.mp4" muted playsinline data-start="0" data-track-index="0"></video></div>
    </div>
    <script>
      // The tags: [big word, small word, where it lands: "head" or "shoulder"], in the order they drop.
      const TAGS = [["Press", "front", "head"], ["Blade", "slice", "head"], ["Day", "dial", "shoulder"], ["Orbit", "ring", "head"],
                    ["Banknote", "", "head"], ["Dolly", "zoom", "shoulder"], ["Live", "cursor", "head"], ["Voice", "note", "shoulder"]];
      // Look. shoulder = where the shoulder pile sits (parts of the frame) and its tilt. punch = zoom on the head.
      const LOOK = { cream: "#efeadb", shoulder: { x: 0.04, y: 0.45, tilt: -17 }, punch: 1.12, blur: 7 };
      // When (seconds): first drop, time between drops, the gust.
      const AT = { first: 0.3, every: 0.19, gust: 2.75 };

      const root = document.getElementById("root");
      const FRAME = { w: Number(root.dataset.width), h: Number(root.dataset.height) };
      const U = Math.min(FRAME.w, FRAME.h) / 1080;
      root.style.setProperty("--u", U); root.style.setProperty("--cream", LOOK.cream);
      const cam = document.getElementById("cam");
      const T = window.TRACK || { fps: 30, pts: [[0.5, 0.2]] };
      const head = (t) => { const p = T.pts[Math.min(T.pts.length - 1, Math.max(0, Math.round(t * T.fps)))]; return [p[0] * FRAME.w, p[1] * FRAME.h]; };
      const [h0x, h0y] = head(0);
      cam.style.transformOrigin = `${h0x}px ${h0y + 120 * U}px`;
      // Seeded small tilts so every render is the same.
      let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const tagH = 66 * U;
      let nHead = 0, nShoulder = 0;
      // No room above the head (a wide or square shot cut close at the top): the head pile sits beside the head.
      const nHeadAll = TAGS.filter((g) => g[2] === "head").length, ROOM = h0y - tagH * nHeadAll > 0.03 * FRAME.h;
      const tags = TAGS.map(([big, sm, where], i) => {
        const d = document.createElement("div"); d.className = "tag"; d.innerHTML = big + (sm ? `<small>${sm}</small>` : "");
        cam.appendChild(d);
        const slot = where === "head" ? nHead++ : nShoulder++;
        return { d, where, slot, at: AT.first + i * AT.every, rot: (rnd() - 0.5) * 7, dx: (rnd() - 0.5) * 40 * U };
      });
      const S = { gust: 0 };
      function draw() {
        const t = tl.time();
        const [hx, hy] = head(t);
        tags.forEach((g, i) => {
          const w = g.d.offsetWidth || 260 * U;
          // Resting place.
          let x, y, rot;
          if (g.where === "head" && ROOM) { x = hx - w / 2 + g.dx; y = hy - tagH * (g.slot + 1) + 6 * U; rot = g.rot; }
          else if (g.where === "head") { x = hx + 200 * U + g.dx * 0.5; y = hy + tagH * (nHeadAll - g.slot - 0.5); rot = g.rot; }
          else { const s = LOOK.shoulder; x = s.x * FRAME.w + g.slot * 10 * U; y = s.y * FRAME.h - tagH * g.slot; rot = s.tilt + g.rot * 0.5; }
          // Falling in: from above the frame, fast, with a vertical smear.
          const a = (t - g.at) / 0.2;
          let fy = 0, blur = 0, sq = 1;
          if (a < 0) { g.d.style.opacity = 0; return; }
          if (a < 1) { const e = a * a; fy = -(1 - e) * (y + 200 * U); blur = LOOK.blur * (1 - a); sq = 1 + 0.5 * (1 - a); }
          else if (a < 1.6) { const b = (a - 1) / 0.6; sq = 1 - 0.12 * Math.sin(b * Math.PI); }
          // The gust: everything flies up and to the right, the top tags first.
          const gk = Math.max(0, S.gust * 1.25 - (g.where === "head" ? (5 - g.slot) * 0.04 : 0.1));
          // Shoulder tags blow off to their own side, so nothing crosses the face.
          const side = g.where === "head" ? 1 : -1;
          const gx = side * gk * FRAME.w * 0.9, gy = -gk * FRAME.h * 0.35, gr = side * gk * 35;
          g.d.style.opacity = 1;
          g.d.style.transform = `translate(${x + gx}px, ${y + fy + gy}px) rotate(${rot + gr}deg) scale(${1 / Math.sqrt(sq)}, ${sq})`;
          g.d.style.filter = blur + gk * 10 > 0.2 ? `blur(${(blur + gk * 10) * U}px)` : "none";
        });
      }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, onUpdate: draw });
      tl.to(cam, { scale: LOOK.punch, duration: 0.25, ease: "power3.out" }, AT.first - 0.15);
      tl.to(S, { gust: 1, duration: 0.45, ease: "power2.in" }, AT.gust);
      tl.to(cam, { scale: 1, duration: 0.25, ease: "power3.inOut" }, AT.gust + 0.35);
      tl.set({}, {}, Number(root.dataset.duration));
      window.__timelines["main"] = tl;
      draw(); tl.seek(0);
    </script>
  </body>
</html>
