<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Checklist: a dark card with a title and 3 to 5 lines. Each line comes in at its time, as the speaker says it.
         Then its box fills, a check draws in, and the text dims with a thin strike. A count (1/3, 2/3…) sits by the title.
         Transparent background: render as mov (ProRes 4444 with alpha) and lay it over the footage.
         The size of the edit is data-width / data-height on #root (1080x1920, 1080x1350, 1080x1080, 1920x1080 all work).
         9:16, 4:5 and 1:1: the card spans the width, near the bottom. 16:9: a narrower card on one side of the speaker.
         Edit TEXT, ITEMS, LOOK and AT below. The length is data-duration on #root (seconds). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-SemiBold.ttf"); font-weight: 600; }
      :root { --ink: #f6f4f0; --muted: rgba(246, 244, 240, 0.5); --panel: rgba(14, 14, 18, 0.9);
              --edge: rgba(255, 255, 255, 0.14); --accent: #7ad48a; --sans: "Inter", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--sans); color: var(--ink); }
      #card { position: absolute; left: 84px; right: 84px; padding: 40px 44px 30px; border-radius: 44px;
        background: var(--panel); border: 2px solid var(--edge);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.08), 0 40px 90px rgba(0, 0, 0, 0.35); }
      #head { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 18px; }
      #title { font-weight: 600; font-size: 46px; line-height: 1.15; letter-spacing: -0.02em; }
      #count { flex: none; height: 52px; min-width: 88px; padding: 0 18px; border-radius: 26px; display: grid; place-items: center;
        background: rgba(255, 255, 255, 0.08); font-weight: 600; font-size: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
      #list { display: flex; flex-direction: column; }
      .slot { overflow: hidden; }
      .row { display: flex; align-items: center; gap: 26px; padding: 20px 0; border-top: 2px solid rgba(255, 255, 255, 0.07); }
      .box { position: relative; flex: none; width: 56px; height: 56px; border-radius: 16px; border: 3px solid rgba(255, 255, 255, 0.4); }
      .fill { position: absolute; inset: -3px; border-radius: 16px; background: var(--accent); }
      .box svg { position: absolute; inset: 7px; width: 36px; height: 36px; overflow: visible; }
      .box path { fill: none; stroke: #121417; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .txt { position: relative; font-weight: 500; font-size: 40px; line-height: 1.2; letter-spacing: -0.01em; }
      /* Shapes other than 9:16: the small count is 32 px. */
      .short #count { font-size: 32px; }
      .strike { position: absolute; left: -4px; right: -4px; top: 54%; height: 3px; border-radius: 2px; background: currentColor; opacity: 0.8; transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="card">
        <div id="head"><div id="title"></div><div id="count"></div></div>
        <div id="list"></div>
      </div>
    </div>
    <script>
      // The title and the lines. at = when the line comes in (seconds, when the speaker says it). Keep 3 to 5 lines.
      const TEXT = { title: "3 things before you post" };
      const ITEMS = [
        { text: "Hook in the first line", at: 0.9 },
        { text: "One idea, not three", at: 2.1 },
        { text: "End with a question", at: 3.3 },
      ];
      // Look. position "lower" (lower third) or "top". offset = the space from that edge (px), per shape of the edit.
      // side = where the card sits in 16:9: "left" or "right" (away from the speaker's face).
      // strike = a thin line through done text; dim = done text goes to the muted colour.
      const LOOK = { position: "lower", offset: { tall: 260, "4:5": 120, square: 48, wide: 48 }, side: "left",
                     accent: "#7ad48a", strike: true, dim: true };
      // When things happen (seconds). in = card enters, tick = time from a line coming in to its tick, out = exit.
      const AT = { in: 0.15, tick: 0.65, out: 5.4 };

      const root = document.documentElement, card = document.getElementById("card");
      root.style.setProperty("--accent", LOOK.accent);
      // The frame comes from data-width / data-height on #root.
      const comp = document.getElementById("root"), W = +comp.dataset.width, H = +comp.dataset.height;
      const SHAPE = W / H < 0.7 ? "tall" : W / H < 0.95 ? "4:5" : W / H < 1.3 ? "square" : "wide";
      if (SHAPE !== "tall") comp.classList.add("short");
      if (SHAPE === "wide") Object.assign(card.style, LOOK.side === "right" ? { left: "auto", width: "760px" } : { right: "auto", width: "760px" });
      card.style[LOOK.position === "top" ? "top" : "bottom"] = LOOK.offset[SHAPE] + "px";
      document.getElementById("title").textContent = TEXT.title;
      const count = document.getElementById("count");
      // One label per count, stacked; the timeline shows one at a time (works when the renderer seeks).
      const counts = ITEMS.map((_, n) => n).concat(ITEMS.length).map((n) => {
        const c = document.createElement("span"); c.textContent = n + "/" + ITEMS.length;
        c.style.gridArea = "1 / 1"; c.style.opacity = n ? 0 : 1; count.appendChild(c); return c;
      });
      const rows = ITEMS.map((it) => {
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = '<div class="box"><div class="fill"></div><svg viewBox="0 0 36 36"><path d="M6 19 L14.5 27 L30 9"/></svg></div>' +
          '<div class="txt"><span></span><div class="strike"></div></div>';
        row.querySelector(".txt span").textContent = it.text;
        if (!LOOK.strike) row.querySelector(".strike").remove();
        const slot = document.createElement("div"); slot.className = "slot"; slot.appendChild(row);
        document.getElementById("list").appendChild(slot);
        return row;
      });

      document.fonts.ready.then(() => {
      const tl = gsap.timeline({ paused: true });
      const lower = LOOK.position !== "top";
      tl.fromTo(card, { opacity: 0, y: lower ? 70 : -70, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, AT.in);
      rows.forEach((row, i) => {
        const at = ITEMS[i].at, done = at + AT.tick;
        const fill = row.querySelector(".fill"), path = row.querySelector("path"), txt = row.querySelector(".txt");
        const len = path.getTotalLength();
        gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
        // The card grows to make room for the line, then the line slides in.
        tl.fromTo(row.parentNode, { height: 0 }, { height: row.offsetHeight, duration: 0.4, ease: "power3.inOut" }, at - 0.15);
        tl.fromTo(row, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at + 0.05);
        tl.fromTo(fill, { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, done);
        tl.to(row.querySelector(".box"), { borderColor: "rgba(0,0,0,0)", duration: 0.15 }, done);
        tl.to(path, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, done + 0.1);
        if (LOOK.dim) tl.to(txt, { color: "rgba(246, 244, 240, 0.6)", duration: 0.35, ease: "power1.out" }, done + 0.15);
        const s = row.querySelector(".strike");
        if (s) tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, done + 0.15);
        tl.set(counts[i], { opacity: 0 }, done);
        tl.set(counts[i + 1], { opacity: 1 }, done);
      });
      const last = ITEMS[ITEMS.length - 1].at + AT.tick;
      tl.to(count, { backgroundColor: LOOK.accent, color: "#121417", duration: 0.3 }, last + 0.1);
      tl.to(card, { opacity: 0, y: lower ? 50 : -50, duration: 0.3, ease: "power2.in" }, AT.out);
      window.__timelines["main"] = tl;
      tl.seek(0);
      });
    </script>
  </body>
</html>
