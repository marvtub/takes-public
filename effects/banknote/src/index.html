<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Banknote: a hard cut to a banknote that fills the frame. The speaker is the engraved portrait in the oval,
         still talking, drawn in fine green wavy lines that get thicker where the picture is dark, like money
         engraving. A big number types itself in digit by digit (and the four corner numbers follow it), under it
         a title line, a seal with your name, a red serial and "This note is not money. The number is real."
         Then a hard cut back.
         Inputs next to this file: footage.mp4 (the moment, at the frame size), person.webm (its cutout) and lum.js
         (from `python3 engrave.py <this folder>`: the portrait's brightness on every engraving line, per frame).
         Full frame: render it as mp4 and lay it over the cut. Made for tall frames (9:16, 4:5); in 1:1 and 16:9 the
         note stands in the middle on a dark ground. Edit NOTE, PORTRAIT, LOOK and AT below. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lum.js"></script>
    <style>
      @font-face { font-family: "Old Standard"; src: url("fonts/OldStandard-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Old Standard"; src: url("fonts/OldStandard-Italic.ttf"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "Oswald"; src: url("fonts/Oswald.ttf"); font-weight: 200 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d1410; }
      #root video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #note { position: absolute; opacity: 0; }
      #note canvas, #note svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #note text { font-family: "Old Standard", serif; }
      #note text.cond { font-family: "Oswald", sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.0" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="footage.mp4" muted playsinline data-start="0" data-track-index="0"></video>
      <div id="note"><canvas id="ink"></canvas><svg id="type"></svg></div>
    </div>
    <script>
      // What the note says. number = the big number (typed digit by digit); words = the same number spelled out,
      // set round the oval; name and role on the seal; serial in red.
      const NOTE = { number: "100,000.", title: "THE FIRST HUNDRED THOUSAND", name: ["Alex", "Rivera"], role: "INSTRUCTOR",
                     serial: "TK 17495335 MA", words: "ONE HUNDRED AND SEVENTY-FOUR THOUSAND, NINE HUNDRED AND FIFTY-THREE",
                     fine: ["THIS NOTE IS NOT MONEY.", "THE NUMBER IS REAL."] };
      // The part of the footage that becomes the portrait: centre x, centre y, width, height (parts of the frame).
      // engrave.py reads this line: keep it on one line.
      const PORTRAIT = { x: 0.5, y: 0.29, w: 0.62, h: 0.44 };
      const LOOK = { paper: "#e4e7da", ink: "#2c5640", deep: "#1a3627", red: "#b8312f", lineW: 1.15 };
      // When (seconds): cut to the note, the number starts typing (time per character), cut back.
      const AT = { in: 0.25, type: 0.45, every: 0.11, out: 2.75 };

      const root = document.getElementById("root");
      const FRAME = { w: Number(root.dataset.width), h: Number(root.dataset.height) };
      // The note is a 9:16 sheet: as big as fits in the frame.
      const NW = Math.min(FRAME.w, FRAME.h * 9 / 16), NH = NW * 16 / 9, s = NW / 1080;
      const note = document.getElementById("note");
      Object.assign(note.style, { width: NW + "px", height: NH + "px", left: (FRAME.w - NW) / 2 + "px", top: (FRAME.h - NH) / 2 + "px" });
      const cv = document.getElementById("ink"), ctx = cv.getContext("2d");
      cv.width = NW; cv.height = NH;
      const svg = document.getElementById("type"), NS = "http://www.w3.org/2000/svg";
      svg.setAttribute("viewBox", `0 0 1080 1920`);
      const el = (tag, a, p = svg) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
      const txt = (x, y, str, a) => { const t = el("text", Object.assign({ x, y, "text-anchor": "middle", fill: LOOK.deep }, a)); t.textContent = str; return t; };

      // ---------- Static engraving: paper, border guilloche, oval frame, seal (drawn once into a buffer) ----------
      const base = document.createElement("canvas"); base.width = NW; base.height = NH;
      const b = base.getContext("2d");
      b.scale(s, s);
      b.fillStyle = LOOK.paper; b.fillRect(0, 0, 1080, 1920);
      b.strokeStyle = LOOK.ink; b.lineWidth = 1;
      // Field of fine wavy lines over the whole note (light).
      b.globalAlpha = 0.35;
      for (let y = 30; y < 1900; y += 9) { b.beginPath(); for (let x = 40; x <= 1040; x += 8) b.lineTo(x, y + 3 * Math.sin(x / 37 + y / 50)); b.stroke(); }
      b.globalAlpha = 1;
      // Border bands: interlaced sine ribbons down both sides and across top and bottom.
      const band = (x0, y0, x1, y1, w, k) => {
        const L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L, nx = -uy, ny = ux;
        for (let j = 0; j < 7; j++) { b.beginPath(); for (let t = 0; t <= L; t += 4) { const o = (w / 2) * Math.sin(t / k + j * 0.9); b.lineTo(x0 + ux * t + nx * o, y0 + uy * t + ny * o); } b.stroke(); }
        b.strokeRect(Math.min(x0, x1) - (nx ? w / 2 + 4 : 0), Math.min(y0, y1) - (ny ? w / 2 + 4 : 0), Math.abs(x1 - x0) + (nx ? w + 8 : 0) || 1, Math.abs(y1 - y0) + (ny ? w + 8 : 0) || 1);
      };
      b.lineWidth = 1.1;
      band(48, 150, 48, 1770, 34, 9); band(1032, 150, 1032, 1770, 34, 9);
      // Oval frame: a rope of crossing ellipses, then the microtext ring (in SVG below).
      const OX = 540, OY = 650, RX = 380, RY = 455;
      for (let j = 0; j < 90; j++) { const a = j / 90 * Math.PI * 2; b.beginPath(); b.ellipse(OX + Math.cos(a) * 6, OY + Math.sin(a) * 6, RX + 30, RY + 30, 0, 0, Math.PI * 2); b.globalAlpha = 0.05; b.stroke(); }
      b.globalAlpha = 1; b.lineWidth = 2.4;
      b.beginPath(); b.ellipse(OX, OY, RX + 48, RY + 48, 0, 0, Math.PI * 2); b.stroke();
      b.beginPath(); b.ellipse(OX, OY, RX, RY, 0, 0, Math.PI * 2); b.stroke();
      // Rosette seal (epitrochoid curves).
      const SX = 540, SY = 1560;
      b.lineWidth = 0.9;
      for (let k = 0; k < 3; k++) { b.beginPath(); for (let t = 0; t <= Math.PI * 2 * 1.0001; t += 0.004) { const R = 120 + k * 22, r = 22 + k * 4, d = 30; const x = (R + r) * Math.cos(t) - d * Math.cos((R + r) / r * t), y = (R + r) * Math.sin(t) - d * Math.sin((R + r) / r * t); b.lineTo(SX + x * 0.95, SY + y * 0.95); } b.stroke(); }
      b.fillStyle = LOOK.paper; b.beginPath(); b.arc(SX, SY, 92, 0, Math.PI * 2); b.fill(); b.lineWidth = 1.6; b.stroke();
      // Wavy side panels beside the seal.
      b.lineWidth = 1; for (let y = 1490; y < 1630; y += 7) { b.beginPath(); for (let x = 80; x <= 1000; x += 6) { if (x > 400 && x < 680) { b.moveTo(x, y); continue; } b.lineTo(x, y + 9 * Math.sin(x / 21) * Math.sin(y / 40)); } b.stroke(); }
      // Boxes: number panel, corner boxes, serial, fine print.
      const box = (x, y, w, h, r = 14) => { b.fillStyle = LOOK.paper; b.beginPath(); b.roundRect(x, y, w, h, r); b.fill(); b.lineWidth = 2; b.stroke(); b.beginPath(); b.roundRect(x + 7, y + 7, w - 14, h - 14, r - 5); b.lineWidth = 1; b.stroke(); };
      box(100, 1180, 880, 270, 20);
      [[30, 30], [710, 30], [30, 1790], [710, 1790]].forEach(([x, y]) => box(x, y, 340, 100));
      box(400, 40, 280, 80); box(400, 1795, 280, 92);

      // ---------- Type (SVG) ----------
      const corners = [[200, 100], [880, 100], [200, 1860], [880, 1860]].map(([x, y]) => txt(x, y, "", { "font-size": 54 }));
      txt(540, 92, NOTE.serial, { "font-size": 30, fill: LOOK.red, "letter-spacing": 2 });
      const big = txt(540, 1365, "", { class: "cond", "font-size": 236, "font-weight": 300, "letter-spacing": -4, fill: LOOK.deep });
      txt(540, 1425, NOTE.title, { class: "cond", "font-size": 50, "font-weight": 400, "letter-spacing": 1 });
      txt(540, 1548, NOTE.name[0], { "font-size": 40, "font-style": "italic" }); txt(540, 1592, NOTE.name[1], { "font-size": 40, "font-style": "italic" });
      txt(540, 1625, NOTE.role, { "font-size": 17, "letter-spacing": 2 });
      txt(540, 1836, NOTE.fine[0], { "font-size": 25, "letter-spacing": 1 }); txt(540, 1868, NOTE.fine[1], { "font-size": 25, "letter-spacing": 1 });
      // Microtext round the oval.
      const ring = el("path", { id: "ring", d: `M ${OX} ${OY - RY - 24} a ${RX + 24} ${RY + 24} 0 1 1 -0.1 0`, fill: "none" });
      const mt = el("text", { "font-size": 22, "letter-spacing": 3, fill: LOOK.deep });
      const tp = el("textPath", { href: "#ring" }, mt); tp.textContent = ` ${NOTE.title} · ${NOTE.words} · ${NOTE.title} · ${NOTE.words} ·`;

      // ---------- Live engraved portrait (canvas, every frame) ----------
      const G = window.LUM, bytes = G ? Uint8Array.from(atob(G.data), (c) => c.charCodeAt(0)) : null;
      function portrait(f) {
        ctx.save(); ctx.scale(s, s);
        ctx.beginPath(); ctx.ellipse(OX, OY, RX - 2, RY - 2, 0, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = LOOK.paper; ctx.fillRect(OX - RX, OY - RY, RX * 2, RY * 2);
        if (!G) { ctx.restore(); return; }
        // Map the portrait grid onto the oval's box.
        const x0 = OX - RX, y0 = OY - RY, w = RX * 2, h = RY * 2, step = h / G.lines, cw = w / G.cols;
        ctx.fillStyle = LOOK.deep;
        for (let r = 0; r < G.lines; r++) {
          const yc = y0 + (r + 0.5) * step;
          // Each engraving line: a gentle wave whose thickness follows how dark the picture is.
          ctx.beginPath();
          const top = [], bot = [];
          for (let c = 0; c < G.cols; c++) {
            const v = bytes[(f * G.lines + r) * G.cols + c] / 255;
            const th = Math.max(0.25, Math.pow(1 - v, 1.15) * step * 0.92 * LOOK.lineW);
            const x = x0 + (c + 0.5) * cw, y = yc + 2.2 * Math.sin(x / 26 + r * 0.35);
            top.push([x, y - th / 2]); bot.push([x, y + th / 2]);
          }
          ctx.moveTo(top[0][0], top[0][1]); top.forEach((p) => ctx.lineTo(p[0], p[1]));
          for (let i = bot.length - 1; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      function draw() {
        const t = tl.time();
        ctx.clearRect(0, 0, NW, NH);
        ctx.drawImage(base, 0, 0);
        const f = G ? Math.min(G.frames - 1, Math.max(0, Math.floor(t * G.fps))) : 0;
        portrait(f);
        const n = Math.max(0, Math.min(NOTE.number.length, Math.floor((t - AT.type) / AT.every) + 1));
        const shown = t < AT.type ? "" : NOTE.number.slice(0, n);
        big.textContent = shown; corners.forEach((c) => (c.textContent = shown));
      }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, onUpdate: draw });
      tl.set(note, { opacity: 1 }, AT.in);
      // The last character lands with a small punch.
      tl.fromTo(big, { attr: { "font-size": 236 } }, { attr: { "font-size": 250 }, duration: 0.07, yoyo: true, repeat: 1, immediateRender: false }, AT.type + (NOTE.number.length - 1) * AT.every);
      tl.set(note, { opacity: 0 }, AT.out);
      tl.set({}, {}, Number(root.dataset.duration));
      window.__timelines["main"] = tl;
      draw(); tl.seek(0);
    </script>
  </body>
</html>
