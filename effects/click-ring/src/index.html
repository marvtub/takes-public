<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Click ring: a soft ring opens at each click of a screen recording, then fades. Transparent
         background: render as mov (ProRes 4444 with alpha) and lay it over the edit.
         clicks.py fills CLICKS, data-duration and the size on #root from the take's cursor log
         (take-NN-screen.events.json), mapped through the edit's crop and scale. Change LOOK by hand. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .ring, .dot { position: absolute; border-radius: 50%; }
      .ring { border-style: solid; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
    </div>
    <script>
      // [t, x, y, r]: seconds from the start of this layer, the click in px of the edit, the ring's full radius in px.
      const CLICKS = [[0.8, 540, 700, 44], [2.4, 300, 1100, 44], [4.0, 760, 1400, 44]];
      // Look. color = the ring, shadow = a dark edge so it shows on light and dark screens.
      // grow = seconds the ring takes to open, line = its width at the start (share of the radius), dot = the soft fill under the click.
      const LOOK = { color: "rgba(255, 255, 255, 0.95)", shadow: "rgba(0, 0, 0, 0.45)", grow: 0.6, line: 0.18, dot: true };

      const comp = document.getElementById("root");
      const centre = (el) => gsap.set(el, { xPercent: -50, yPercent: -50 });
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        for (const [t, x, y, r] of CLICKS) {
          if (LOOK.dot) {
            const d = document.createElement("div"); d.className = "dot";
            Object.assign(d.style, { left: x + "px", top: y + "px", width: r + "px", height: r + "px",
              background: LOOK.color, opacity: 0 });
            comp.appendChild(d); centre(d);
            tl.set(d, { opacity: 0.45, scale: 0.6 }, t);
            tl.to(d, { opacity: 0, scale: 1, duration: 0.3, ease: "power2.out" }, t);
          }
          const edge = Math.max(1, Math.round(r * 0.05));
        const ring = document.createElement("div"); ring.className = "ring";
          Object.assign(ring.style, { left: x + "px", top: y + "px", width: 2 * r + "px", height: 2 * r + "px",
            borderColor: LOOK.color, borderWidth: Math.max(2, r * LOOK.line) + "px", opacity: 0,
            boxShadow: "0 0 0 " + edge + "px " + LOOK.shadow + ", inset 0 0 0 " + edge + "px " + LOOK.shadow + ", 0 0 " + Math.round(r * 0.3) + "px " + LOOK.shadow });
          comp.appendChild(ring); centre(ring);
          // A set then a to (not fromTo): before its click a ring stays hidden, also when the renderer seeks back.
          tl.set(ring, { opacity: 1, scale: 0.25 }, t);
          tl.to(ring, { opacity: 0, scale: 1, duration: LOOK.grow, ease: "power2.out" }, t);
        }
        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
