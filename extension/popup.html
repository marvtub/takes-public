<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record in Takes</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/icon-32.png" alt="" width="20" height="20"><span>Record in Takes</span></header>
  <label for="title">Title</label>
  <input id="title" type="text" maxlength="80" placeholder="Untitled">
  <label for="text">Script</label>
  <textarea id="text" placeholder="Select words on the page, or write here."></textarea>
  <p class="hint" id="hint">It opens in Takes as a new session in Inbox.</p>
  <button id="go" disabled>Record in Takes</button>
  <a class="get" href="https://gettakes.app" target="_blank" rel="noopener">No Takes yet? Get it free for Mac</a>
  <script type="module" src="popup.js"></script>
</body>
</html>
